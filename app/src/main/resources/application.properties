server.port=9090

# CORS - comma-separated list of allowed origins
cors.allowed-origins=http://localhost:3000

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.show-sql=true

# Disable Spring Security's default InMemoryUserDetailsManager (we use JWT)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT configuration
app.jwt.secret=my-super-secret-jwt-key-change-this-in-production-min-32-chars
app.jwt.access-token-expiry-ms=3600000
app.jwt.refresh-token-expiry-days=7

# Application domain (used to build short URLs)
app.domain=https://www.urlShortener.com/

# Click deduplication (003-url-click-analytics)
# Set enabled=false to count every click; strategies: USERNAME (default), IP
app.analytics.deduplication.enabled=true
app.analytics.deduplication.strategy=USERNAME
app.analytics.deduplication.window-minutes=60
